plugins {
    id 'com.android.application'
}

def getTelegramAppId() {
    def prop = project.findProperty("TELEGRAM_APP_ID")
    if (prop != null && !prop.toString().trim().isEmpty() && prop.toString() != "0") {
        return prop.toString().trim()
    }
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
        if (localProps.getProperty("TELEGRAM_APP_ID") != null) {
            return localProps.getProperty("TELEGRAM_APP_ID").trim()
        }
    }
    def env = System.getenv("TELEGRAM_APP_ID")
    if (env != null && !env.trim().isEmpty()) {
        return env.trim()
    }
    return "0"
}

def getTelegramAppHash() {
    def prop = project.findProperty("TELEGRAM_APP_HASH")
    if (prop != null && !prop.toString().trim().isEmpty()) {
        return prop.toString().trim()
    }
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
        if (localProps.getProperty("TELEGRAM_APP_HASH") != null) {
            return localProps.getProperty("TELEGRAM_APP_HASH").trim()
        }
    }
    def env = System.getenv("TELEGRAM_APP_HASH")
    if (env != null && !env.trim().isEmpty()) {
        return env.trim()
    }
    return ""
}

android {
    namespace 'com.nexgram.messenger'
    compileSdk 35

    defaultConfig {
        applicationId "com.nexgram.messenger"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject dynamic Telegram credentials into BuildConfig (never hardcoded in git)
        def appId = getTelegramAppId()
        def appHash = getTelegramAppHash()
        buildConfigField "int", "TELEGRAM_APP_ID", "${appId}"
        buildConfigField "String", "TELEGRAM_APP_HASH", "\"${appHash}\""
        buildConfigField "String", "APP_NAME", "\"NexGram\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official TDLib 1.8.70 Android Archive (arm64-v8a & armeabi-v7a)
    implementation files('libs/tdlib-android.aar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
