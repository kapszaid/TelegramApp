name: Build NexGram Native Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'nexgram-native/**'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Telegram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Telegram API Keys & Properties
        run: |
          cd nexgram-native
          # Use GitHub repository secrets with safe zero defaults (no hardcoded fallback production credentials)
          echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID || '0' }}" >> gradle.properties
          echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH || '' }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || 'androidkey' }}" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}" >> gradle.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd nexgram-native
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd nexgram-native
          ./gradlew assembleDebug --stacktrace

      - name: Upload NexGram Native APK
        uses: actions/upload-artifact@v4
        with:
          name: NexGram-Native-Debug-APK
          path: nexgram-native/app/build/outputs/apk/debug/*.apk
          retention-days: 14
